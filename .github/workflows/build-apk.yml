name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip Android project
        run: unzip -o android.zip -d .
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk relay-forwarder.apk
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: relay-forwarder-apk
          path: relay-forwarder.apk
          if-no-files-found: error
      - name: Publish to public Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Relay APK
          files: relay-forwarder.apk
